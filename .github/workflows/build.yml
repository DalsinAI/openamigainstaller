name: Build OpenInstaller

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to make on this commit, such as v1.0.0-rc1 (empty builds only)'
        required: false

permissions:
  contents: write

env:
  # the tag without its v, or a test version for pull requests
  VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version || 'v1.0.0-test' }}

jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev
      - name: The language, file installs and the extras
        run: make test
      - name: The same under AddressSanitizer
        run: make asan
      - name: Built without curl
        run: make test NO_CURL=1

  amiga:
    runs-on: ubuntu-24.04   # the toolchain needs glibc 2.38
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends jlha-utils
      - name: 68040 soft float with the Team's toolchain, and the .lha
        run: sh package/amiga/build-ci.sh "${VERSION#v}" dist
      - uses: actions/upload-artifact@v4
        with: { name: amiga, path: dist/* }

  # A tag v*, or a run with a version, publishes the release; a version with
  # a suffix (v1.0.0-rc1) is a pre-release.
  publish:
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.version, 'v')
    needs: [host, amiga]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version || github.ref_name }}
        run: |
          cd dist && sha256sum * > SHA256SUMS && cd ..
          pre=; case $TAG in *-*) pre=--prerelease ;; esac
          gh release create "$TAG" dist/* $pre --target "$GITHUB_SHA" --title "OpenInstaller ${TAG#v}" --notes-file RELEASE-NOTES.md
